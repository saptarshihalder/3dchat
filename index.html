<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <title>3D Chat — My Lobby</title>
  <link rel="stylesheet" href="./style.css?v=raw-webgl-20260923-3">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    #canvas,#text{position:fixed;inset:0;width:100%;height:100%;display:block}
    #canvas{z-index:0}#text{z-index:4;pointer-events:none}
    #hud{position:fixed;z-index:10;top:16px;left:18px;display:flex;gap:12px;pointer-events:none}
    #hud h1{font-size:16px;margin:0 0 2px}
    #network{position:fixed;z-index:10;right:18px;top:16px}
    #chatbox{position:fixed;z-index:12;left:50%;bottom:18px;transform:translateX(-50%);width:min(610px,calc(100vw - 36px))}
    #controls{position:fixed;z-index:11;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}
    .pad{display:none}
    #join{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,5,9,.88)}
    #join .card{width:min(420px,100%)}
    @media(max-width:760px),(pointer:coarse){.pad{display:block}}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <canvas id="text"></canvas>

  <header id="hud">
    <div>
      <h1>My Lobby</h1>
      <span id="online">1 user online</span>
    </div>
    <span id="engine">custom WebGL engine · no 3D library</span>
  </header>

  <div id="network">local world</div>
  <div id="crosshair">+</div>

  <section id="chatbox">
    <div id="messages"></div>
    <form id="chat-form">
      <input id="msg" maxlength="100" autocomplete="off" placeholder="Send out a message">
      <button type="submit">Send</button>
    </form>
  </section>

  <div id="controls">
    <div class="pad">
      <button data-key="87">W</button>
      <div><button data-key="65">A</button><button data-key="83">S</button><button data-key="68">D</button></div>
    </div>
    <div class="pad">
      <button data-key="38">↑</button>
      <div><button data-key="37">←</button><button data-key="40">↓</button><button data-key="39">→</button></div>
    </div>
  </div>

  <div id="join">
    <div class="card">
      <small>3D CHAT · BUILT FROM SCRATCH</small>
      <h2>Enter My Lobby</h2>
      <p>The original handmade WebGL world — no Three.js, no 3D engine.</p>
      <input id="name" maxlength="24" placeholder="Your name">
      <button id="enter">Enter lobby</button>
    </div>
  </div>

  <div id="fatal" hidden></div>
  <script src="./script.js?v=raw-webgl-20260923-3"></script>
</body>
</html>
